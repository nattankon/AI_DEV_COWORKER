[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-coworker"
version = "0.1.0"
description = "Standalone local-first AI coding coworker CLI"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.28,<2",
]
embeddings = [
  "fastembed>=0.4,<1",
]

[project.scripts]
cowork = "AI_DEV_COWORKER.cli:run"

[tool.setuptools]
packages = ["AI_DEV_COWORKER"]

[tool.setuptools.package-dir]
AI_DEV_COWORKER = "."
